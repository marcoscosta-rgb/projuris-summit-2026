<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Formulário de captação — Projuris Summit 2026</title>
<style>
*{box-sizing:border-box}
body{margin:0;background:#0b1220;color:#eef3fb;
  font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,sans-serif;padding:16px}
.topo{max-width:640px;margin:0 auto 18px;padding-top:env(safe-area-inset-top)}

  border-radius:16px;padding:18px}
.volta{display:block;max-width:640px;margin:18px auto 40px;text-align:center;

<body>

  <h1>Formulário de captação</h1>

<div class="caixa"><div id="form"></div></div>
<a class="volta" href="../app/">Voltar para o leitor de QR</a>
<script src="https://js.hsforms.net/forms/embed/v2.js"></script>
<script>
  hbspt.forms.create({
    region: "na1",

    target: "#form"
