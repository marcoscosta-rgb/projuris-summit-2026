name: Sincroniza negócios do Summit

# O formulário do HubSpot cria apenas o contato. Este fluxo cria o negócio
# correspondente no pipeline do evento, atribuído a quem captou o lead.
# Roda na nuvem: não depende de nenhuma máquina ligada.

# O agendamento foi DESLIGADO de propósito: quem cria os negócios em tempo real
# são as automações nativas do HubSpot (ver cria-automacoes.mjs). Manter os dois
# ligados duplicaria negócios, porque a automação nativa não checa duplicidade.
# Este fluxo fica como rede de segurança, disparado à mão quando necessário —
# por exemplo, ao carregar o mailing que a organização entrega após o evento.
on:
  workflow_dispatch:

# só uma execução por vez, para não criar negócio duplicado
concurrency:
  group: sincroniza-summit
  cancel-in-progress: false

jobs:
  sincroniza:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - name: Criar negócios pendentes
        env:
          HUBSPOT_TOKEN: ${{ secrets.HUBSPOT_TOKEN }}
        run: |
          if [ -z "$HUBSPOT_TOKEN" ]; then
            echo "::error::HUBSPOT_TOKEN não configurado nos secrets do repositório"
            exit 1
          fi
          node sincroniza-deals.mjs
